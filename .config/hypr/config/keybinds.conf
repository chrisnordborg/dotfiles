# use command xprop and activate the application to get the 'WM_CLASS(STRING)' second value

#See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT # Sets "ALT" key as main modifier
#$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, workspace, 1
bind = $mainMod, RETURN, exec, $HOME/.config/scripts/launch_terminal_last_dir.sh
#bind = $mainMod, t, exec, $HOME/.config/scripts/launch_terminal_last_dir.sh
#bind = $mainMod, b, workspace, 3
bind = $mainMod, b, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod, g, workspace, 10
bind = $mainMod, g, exec, steam
bind = $mainMod, C, exec, $editor
bind = $mainMod, S, exec, $editor-alt
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, Q, exit,
bind = $mainMod, e, exec, $fileManager
bind = $mainMod, W, togglefloating,
#bind = $mainMod, a, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod Shift, R, exec, hyprctl reload
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, i, togglesplit, # dwindle

bind = SUPER, E, exec, jome -d | wl-copy #Emojipicker + clipboard copy


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + hjkl
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Move window inside workspace with mainMod + SHIFT + hjkl
bind = $mainMod_SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod SHIFT, k, swapwindow, u 
bind = $mainMod SHIFT, l, swapwindow, r 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch to previous workspace
bind = $mainMod, Tab, workspace, previous

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9libfreeaptx-0.2.2-1-x86_64   19.0 KiB   514 KiB/s 00:00 [##############################] 100%
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod SHIFT, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:273, resizewindow

# Move/resize windows + Mouse
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Resize windows
binde = $mainMod SHIFT, Right, resizeactive, 30 0
binde = $mainMod SHIFT, Left, resizeactive, -30 0
binde = $mainMod SHIFT, Up, resizeactive, 0 -30
binde = $mainMod SHIFT, Down, resizeactive, 0 30

# Toggle maximize window
bind = $mainMod, f, fullscreen

# Pin window
#bind = $mainMod, s, pin

# System  prompt
#bind = $mainMod, ESCAPE, exec, bash ~/dotfiles/.config/scripts/system_prompt.sh
bind = $mainMod, ESCAPE, exec, wlogout
# Clipboard
bind = $mainMod, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist decode | wl-copy

# Colour Picker
bind = $mainMod, P, exec, bash ~/dotfiles/.config/scripts/colorpicker.sh

# Screen locking
#bind = SUPER, L, exec, hyprlock

# wallpaper
#bind = $mainMod SHIFT, w, exec, swww img $(find ~/dotfiles/wallpapers/ -type f | shuf -n 1) --transition-fps 60
#bind = $mainMod SHIFT, w, exec, swww img $(find ~/dotfiles/wallpapers/ -type f | shuf -n 1) --transition-fps 255 --transition-type outer --transition-duration 0.8 
bind=Super, w, exec, bash ~/dotfiles/.config/scripts/select_wallpaper_theme.sh tofi
bind=$mainMod SHIFT, w, exec, bash ~/dotfiles/.config/scripts/random_wallpaper.sh

# waybar
bind = Ctrl, Escape, exec, killall waybar || $waybarSetup # toggle waybar

# Screenshot 
bind=,Print, exec, bash ~/dotfiles/.config/scripts/screenshot.sh full #fullscreen
bind=$mainMod, Print, exec, bash ~/dotfiles/.config/scripts/screenshot.sh area #select area
# add --cursor flag to include cursor also, --freeze flag to freeze before selection
#bind = , Print, exec, grimblast --notify copysave screen # Entire screen + clipboard copy
#bind = SUPER, Print, exec, grimblast --notify copysave active # current Active window only + clipboard copy
#bind = SUPER ALT, Print, exec, grimblast --notify copysave area # Select area to take screenshot

# Switch audio output
bind = $mainMod SHIFT, a, exec, bash ~/.config/scripts/audio_output_switch.sh tofi

# Open note
bind = $mainMod SHIFT, n, exec, bash ~/.config/scripts/create_note.sh tofi
# Open the fzf note launcher in a floating terminal
#bind = $maiMod SHIFT, n, exec, kitty --class fzflauncher -o initial_window_width=600 -o initial_window_height=400 ~/dotfiles/.config/scripts/fzf.sh

# Run conversion scripts
bind = $mainMod SHIFT, c, exec, bash ~/.config/scripts/conversions.sh tofi

# Run android file transfer script 
bind = $mainMod, d, exec, bash ~/.config/scripts/adb_transfer.sh tofi

# Run device mounting script
bind = $mainMod SHIFT, d, exec, bash ~/.config/scripts/mount_devices.sh tofi


# Start timer
bind = $mainMod SHIFT, t, exec, bash ~/.config/scripts/toolbar/timer.sh tofi

# Start Pomodoro timer
bind = $mainMod SHIFT, p, exec, bash ~/.config/scripts/toolbar/pomodoro.sh tofi

# Backup data
#bind = $maindMod SHIFT, b, exec, bash ~/.config/scripts/backup.sh all

#Volume and Media Control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
